appId: com.wttp.app
productName: Wttp
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!{postcss.config.js,tailwind.config.js,playwright.config.ts,vitest.config.ts}"
  - "!{CONTRIBUTING.md,CODE_OF_CONDUCT.md,CLAUDE.md}"
  - "!.claude{,/**}"
  - "!docs{,/**}"
  - "!arch-docs{,/**}"
  - "!e2e{,/**}"
  - "!cli{,/**}"
  - "!scripts{,/**}"
  - "!vite.cli.config.ts"
fileAssociations:
  - ext: wttp.yaml
    name: Wttp Workspace
    description: Wttp workspace file
    icon: build/icon
    role: Editor
    # required on Linux for electron-builder to emit the mime-type XML / .desktop
    # MimeType= entry — Windows/macOS associate by `ext` alone and ignore this. Has no
    # effect here in practice: electron-builder rejects dotted `ext` values on Linux
    # (`*.wttp.yaml` glob), so only Windows/macOS actually get the association —
    # matches the task's "quando o SO permitir" (build logs a skip warning, harmless).
    mimeType: application/vnd.wttp.workspace+yaml
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
win:
  executableName: wttp
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # fileAssociations only registers on Windows when the install is per-machine
  # (electron-builder requirement, not configurable per-association) — accepts the
  # one-time UAC prompt in exchange for .wttp.yaml opening the app on double-click.
  perMachine: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # No `notarize: false` here on purpose — electron-builder auto-notarizes only when
  # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID are present in the environment
  # (arch-docs/release.md), and silently skips it otherwise. Forcing it off would also
  # disable it in CI once the secrets are configured.
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  # Pasta de PNGs `NxN.png` em tamanhos padrão do tema hicolor. Com um único
  # `build/icon.png` de 1024px o `.deb` instalava só `hicolor/1024x1024`, tamanho que o
  # GTK/GNOME ignora (fora do index.theme) — o Wttp ficava sem ícone no menu e no dock.
  icon: build/icons
  target:
    - AppImage
    - deb
  maintainer: https://github.com/wesleyara/Wttp
  category: Development
  synopsis: Open source HTTP client for developing, testing and documenting APIs
  syncDesktopName: true
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
# electron-updater lê isto em runtime (EP-11-T03) para saber onde checar por uma
# versão nova — GitHub Releases do próprio repositório. Nunca invocado em CI fora do
# workflow de release (EP-11-T04): o job `build` do CI roda sem `--publish`.
publish:
  provider: github
  owner: wesleyara
  repo: Wttp
  # EP-11-T04: cada plataforma sobe pro mesmo release (por tag) sem publicá-lo — fica
  # draft até alguém revisar manualmente e clicar em "Publish release" no GitHub.
  releaseType: draft
