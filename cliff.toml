# git-cliff (https://git-cliff.org) — gera a seção de uma versão nova do CHANGELOG.md a
# partir dos Conventional Commits desde a última tag. Não roda sozinho: `yarn release
# <versão>` (scripts/release.mjs) chama `git-cliff --unreleased --tag v<versão>` e cola o
# resultado logo abaixo de `## [Unreleased]`. As versões 0.1.0–0.3.0 foram curadas à mão
# e não são regeneradas — o CHANGELOG.md versionado é a fonte da verdade, não este arquivo.

[changelog]
header = ""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]\
{% if previous.version %}(https://github.com/wesleyara/Wttp/compare/{{ previous.version }}...{{ version }})\
{% else %}(https://github.com/wesleyara/Wttp/releases/tag/{{ version }}){% endif %} \
- {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
{# Capitaliza, exceto quando a primeira palavra é um identificador (`wttp.setVar`, `history:append`). -#}
{% set first_word = commit.message | split(pat=" ") | first -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if first_word is containing(".") or first_word is containing(":") %}{{ commit.message }}\
{% else %}{{ commit.message | upper_first }}{% endif %}
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(fix|feat): (adjust|change) (minor things|ui|history|change analyzer)$", skip = true },
  { message = "^feat: (implement ep |environments tab response panel ui$)", skip = true },
  { message = "^docs: (close out|record) ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  # Qualquer outro tipo (chore, ci, test, build, style, tipos fora do padrão) fica fora.
  { message = ".*", skip = true },
]
