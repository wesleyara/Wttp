name: Release

# Publicar uma versão: `yarn release <versão>` (scripts/release.mjs) cria o commit
# `chore(release)` com o CHANGELOG.md atualizado e a tag `v<versão>`; empurrar a tag
# dispara este workflow. `quality` roda de novo aqui (alguém pode taguear um commit que
# nunca passou pela `main`), Linux e Windows empacotam e sobem pro mesmo release do GitHub
# (por tag, `electron-builder` cuida de criar/reaproveitar), e o release sai como rascunho
# (`releaseType: draft` em `electron-builder.yml`) até revisão manual.
#
# macOS é opcional (card #63): sem certificado Developer ID o `.dmg` abre com aviso do
# Gatekeeper, e o runner macOS é o mais caro. Para incluí-lo, rode este workflow à mão
# (Actions → Release → Run workflow) com a tag e `macos` marcado — ele reaproveita o mesmo
# release rascunho.
#
# As notas do release vêm da seção da versão no CHANGELOG.md versionado
# (`scripts/changelog.mjs`), não de uma geração nova a partir dos commits — o changelog
# pode ter sido editado à mão antes da tag, e é ele que o site de documentação mostra.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.4.0)"
        required: true
        type: string
      macos:
        description: "Also build the macOS installer"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

# O GITHUB_TOKEN deste repositório é só leitura por padrão (Settings → Actions →
# Workflow permissions); criar o release e subir os instaladores exige escrita em
# `contents` — sem isto o electron-builder recebe 403 "Resource not accessible by
# integration".
permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  meta:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # `v0.1.0`/`v0.2.0` foram criadas depois, retroativamente, sobre commits antigos do
      # histórico — existem para o changelog e o GitHub Releases terem versões, não para
      # gerar instaladores de código que nunca foi distribuído. Atenção: num push de tag
      # o GitHub roda o workflow *do commit taggeado*, e o desses dois commits é a versão
      # antiga (sem esta guarda) — por isso elas são empurradas com o Actions desligado
      # (arch-docs/release.md). A guarda aqui cobre o `workflow_dispatch` com essas tags.
      - name: Resolve tag and build matrix
        id: resolve
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          MACOS: ${{ inputs.macos || false }}
        run: |
          case "$TAG" in
            v0.1.0|v0.2.0)
              echo "::notice::$TAG is a retroactive tag; its release has notes only, no installers."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::package.json version ($version) does not match tag $TAG."
            exit 1
          fi
          matrix='[{"os":"ubuntu-latest","script":"release:linux"},{"os":"windows-latest","script":"release:win"}'
          if [ "$MACOS" = "true" ]; then
            matrix="$matrix"',{"os":"macos-latest","script":"release:mac"}'
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix]" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn typecheck

      - run: yarn test

  # Cria o release rascunho *uma vez*, antes dos builds. Sem isto, os jobs de Linux,
  # Windows e macOS rodam em paralelo, nenhum acha o rascunho do outro, e cada
  # electron-builder cria o seu — dois ou três rascunhos da mesma tag, com título
  # "0.3.1" (a versão, sem o "v"). Com o rascunho já existente, o electron-builder só
  # sobe os arquivos nele (acha pela tag) e mantém título e notas.
  draft:
    name: Create draft release
    needs: [meta, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Falha se o CHANGELOG.md não tiver a seção da versão — um release sem notas é
      # sinal de que a tag não veio de `yarn release`.
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: node scripts/changelog.mjs section "$TAG" > "$RUNNER_TEMP/release-notes.md"

      # Rodar de novo (ex: para incluir o macOS) reaproveita o release existente e só
      # atualiza título e notas — nunca mexe no estado rascunho/publicado.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$notes"
          fi

  build:
    name: Build and publish (${{ matrix.os }})
    needs: [meta, draft]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.meta.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      # `release:*` (ao contrário de `build:*`, usado em ci.yml) roda com
      # `--publish always` — cria/atualiza o release do GitHub para a tag e sobe os
      # instaladores. Assinatura (EP-11-T02) segue opcional: sem os secrets, sai sem
      # assinar, mas ainda publica.
      - name: Build installer
        shell: bash
        env:
          SCRIPT: ${{ matrix.script }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Secret ausente chega como string vazia, não como variável indefinida, e o
          # electron-builder trata `CSC_LINK=""` como "tem certificado": resolve o caminho
          # vazio para a pasta do projeto e falha com "<repo> not a file" (visto no macOS).
          # Só as variáveis com valor seguem para o build; sem nenhuma, ele não assina.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          yarn "$SCRIPT"

      # `electron-builder` já sobe latest.yml/latest-mac.yml/latest-linux.yml (usados
      # pelo auto-update, EP-11-T03) com SHA512 embutido, mas isso não é um checksum
      # que alguém baixando o instalador manualmente consegue conferir sozinho —
      # daí este SHA256SUMS por plataforma, subido à parte pro mesmo release.
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          files=(*.exe *.dmg *.AppImage *.deb)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > "SHA256SUMS-${{ runner.os }}.txt"
          fi

      - name: Upload checksums to release
        if: hashFiles('dist/SHA256SUMS-*.txt') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.meta.outputs.tag }}" dist/SHA256SUMS-*.txt --clobber
