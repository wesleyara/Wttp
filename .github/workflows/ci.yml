name: CI

# EP-10-T03: nothing broken merges into main.
#
# - `quality` and `build` run on every PR against main/develop and on push to
#   main, across the three OSes electron-builder targets.
# - `e2e` is heavier (a full `yarn build` + a real Electron app per test) and
#   only runs on push to main or on a PR carrying the `run-e2e` label — add
#   the label to opt a specific PR in, or drop it to stop running E2E on
#   further pushes to that PR. `types: [..., labeled]` makes adding the label
#   itself trigger a run, not just the next push.
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    # A `labeled` event only exists to let `e2e` react to the label being
    # added — lint/typecheck/test already ran on the push that preceded it,
    # so skip re-running the whole matrix for it.
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn typecheck

      - run: yarn test

      # EP-13-T02: the `wttp run` CLI, bundled and run the way CI would run it —
      # plain Node, no Electron, no display — against a local mock server.
      - name: CLI smoke test
        if: matrix.os == 'ubuntu-latest'
        run: yarn build:cli && node scripts/cli-smoke.mjs

  build:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    name: Build installer (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Validates the installer builds successfully on each OS. Not
      # published anywhere — electron-builder's `publish` config is never
      # invoked here. Signing/notarization secrets (EP-11-T02, arch-docs/release.md) are
      # optional here on purpose: unset on a fork or before the repo owner adds them,
      # the step below drops the empty ones so electron-builder skips signing instead
      # of failing the build.
      - name: Build installer
        shell: bash
        env:
          SCRIPT: ${{ matrix.script }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Secret ausente chega como string vazia, não como variável indefinida, e o
          # electron-builder trata `CSC_LINK=""` como "tem certificado": resolve o caminho
          # vazio para a pasta do projeto e falha com "<repo> not a file" (visto no macOS).
          # Só as variáveis com valor seguem para o build; sem nenhuma, ele não assina.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          yarn "$SCRIPT"

  e2e:
    name: E2E
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      # e2e/fixtures.ts launches the app's own bundled Chromium headlessly
      # (--headless=new) rather than a Playwright-downloaded browser, so no
      # `playwright install` — but the OS still needs the shared libraries
      # Chromium links against to run at all.
      - run: npx playwright install-deps chromium

      # e2e/*.spec.ts drive `out/main/index.js`, the production build — not
      # the dev server (EP-10-T02).
      - run: yarn build

      # O Electron no Linux não sobe sem um servidor gráfico, mesmo com
      # --headless=new: sem DISPLAY a janela nunca abre e cada teste espera o
      # timeout inteiro. O xvfb dá um display virtual. O sysctl libera os user
      # namespaces que o sandbox do Chromium usa e que o AppArmor do Ubuntu 24.04
      # bloqueia por padrão.
      - name: Prepare a virtual display
        run: |
          sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: xvfb-run --auto-servernum yarn test:e2e

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
