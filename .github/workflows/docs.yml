name: Docs

# EP-08.1-T07: publishes the VitePress user documentation (pt-BR at the root, English
# under /en/) to GitHub Pages at https://wesleyara.github.io/Wttp/.
#
# One-time repository setup (a human must do it — Settings → Pages → Build and
# deployment → Source: "GitHub Actions"). Until then the `deploy` job fails; `build`
# still runs and proves `yarn docs:build` passes.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "package.json"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "package.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      # `--ignore-scripts`: the electron-builder postinstall is irrelevant for docs.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    # Only publish from main — PRs just prove the build passes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
